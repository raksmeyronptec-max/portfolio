project_id = "ron-raksmey-portfolio-cms"

# Ports are deliberately offset from the Supabase defaults (54321/54322/…) so
# this stack can run alongside another local Supabase project without a port
# collision. Update .env.local if you change them.
[api]
enabled = true
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
# Certificate originals and resume PDFs are the largest uploads we accept.
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/admin/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Admin accounts are created deliberately by the owner, never self-served.
enable_signup = false

[auth.email]
# This must be `true`, despite reading like "anyone can register".
#
# The CLI maps `auth.email.enable_signup` onto GoTrue's
# GOTRUE_EXTERNAL_EMAIL_ENABLED — it is the switch for the email *provider*, not
# just for registration. Setting it to false turned off email/password sign-in
# altogether, so every local admin login failed with
# `422 email_provider_disabled`. The E2E suite is what caught it.
#
# Self-service registration is closed by `auth.enable_signup = false` above,
# which becomes GOTRUE_DISABLE_SIGNUP=true. That is the correct control for
# "the owner creates accounts, nobody signs themselves up".
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
